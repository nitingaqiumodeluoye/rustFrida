name: Build (Android aarch64)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: r29
  NDK_DIR: /opt/android-ndk-r29
  # eBPF 工具链缓存版本：llvm-23 / bpf-linker 升级或缓存失效时手动 bump
  EBPF_CACHE_VERSION: v1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: agent + rustfrida
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # NDK r29 安装到 /opt/android-ndk-r29，与仓库内 .cargo/config.toml
      # 里写死的 linker / sysroot / BINDGEN_EXTRA_CLANG_ARGS 路径保持一致。
      - name: Restore Android NDK ${{ env.NDK_VERSION }}
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_VERSION }}-linux-x86_64

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            -o /tmp/android-ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          sudo mkdir -p "${NDK_DIR}"
          sudo unzip -q /tmp/android-ndk.zip -d /opt
          rm -f /tmp/android-ndk.zip

      # NDK 交叉工具（clang / llvm-ar / llvm-ranlib / libclang）统一由仓库里的
      # .cargo/config.toml 的 [env] 提供，这里只做存在性校验 + 给纯 shell 步骤
      # （python3 loader/build_helpers.py 不走 cargo [env]）补 ANDROID_NDK_HOME。
      # 所以本流水线同时也在验证「只靠仓库 config 就能构建」。
      - name: Configure Android NDK env
        run: |
          set -euxo pipefail
          TC="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "${TC}/aarch64-linux-android33-clang"
          test -x "${TC}/aarch64-linux-android33-clang++"
          test -x "${TC}/llvm-ar"
          test -x "${TC}/llvm-ranlib"
          test -x "${TC}/llvm-objcopy"
          test -d "${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -f "${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/lib/libclang.so"

          # .cargo/config.toml 里写死了这个路径，装错地方要在这里就报错
          grep -q "${NDK_DIR}" .cargo/config.toml

          {
            echo "ANDROID_NDK_HOME=${NDK_DIR}"
            echo "ANDROID_NDK_ROOT=${NDK_DIR}"
          } >> "${GITHUB_ENV}"
          echo "${TC}" >> "${GITHUB_PATH}"

          "${TC}/aarch64-linux-android33-clang" --version | head -1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Show toolchain
        run: |
          rustc -Vv
          cargo -V
          python3 --version

      # 0) zymbiote payload：rust_frida 通过 include_bytes! 内嵌
      #    zymbiote/build/zymbiote.elf。build.sh 用 NDK clang 现场重建，
      #    避免「改了 zymbiote.c、仓库里的 ELF 还是旧的」这种静默失效。
      - name: Build zymbiote payload
        run: bash zymbiote/build.sh

      # 1) loader shellcode：rustfrida 通过 include_bytes! 内嵌，必须先构建。
      #    （rust_frida/build.rs 也会兜底重跑，这里显式跑一次便于早期报错）
      - name: Build loader shellcode
        run: python3 loader/build_helpers.py

      # 2) agent：rustfrida 通过 include_bytes! 内嵌 libagent.so，必须先于主程序。
      - name: Build agent (libagent.so)
        run: cargo build -p agent --release --locked --target aarch64-linux-android

      # 3) 主程序：内嵌 bootstrapper.bin + rustfrida-loader.bin + libagent.so
      #    启用 watch-so feature：内嵌 ldmonitor eBPF SO 加载监听能力（--watch-so）
      #    watch-so 会通过 aya-build 现场编译 ldmonitor-ebpf（bpfel-unknown-none 目标），
      #    需要：nightly 工具链 + rust-src 组件 + bpf-linker 链接器 + LLVM-23 开发库
      #    （三者均已在上面带缓存的 Install eBPF toolchain 步骤中就绪）。
      #    整个 rustfrida 构建用 +nightly 跑，保证 build script 内部子 cargo 也是 nightly（-Z build-std 需要）。
      # ---- eBPF 工具链缓存（llvm-23 deb + nightly 工具链 + bpf-linker）----
      # 缓存内容：
      #   /tmp/llvm-23-debs                    llvm-23-dev 及其依赖的 deb 包（离线安装）
      #   ~/.rustup/toolchains/nightly-*       nightly + rust-src + android target
      #   ~/.cargo/bin/bpf-linker              bpf-linker 二进制（编译最耗时，命中可省 ~3 分钟）
      # EBPF_CACHE_VERSION 变化或首次运行时回源重建并写入缓存。
      - name: Restore eBPF toolchain cache
        id: ebpf-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/llvm-23-debs
            ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu
            ~/.cargo/bin/bpf-linker
          key: ebpf-toolchain-${{ env.EBPF_CACHE_VERSION }}

      - name: Install eBPF toolchain (for watch-so)
        run: |
          set -euxo pipefail

          # 1) llvm-23-dev：优先用缓存的 deb 离线安装，否则在线下载并回写缓存
          mkdir -p /tmp/llvm-23-debs
          if ! ls /tmp/llvm-23-debs/*.deb >/dev/null 2>&1; then
            CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            curl -fLsS https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends --download-only llvm-23-dev
            cp /var/cache/apt/archives/*.deb /tmp/llvm-23-debs/
          fi
          if ! test -x /usr/lib/llvm-23/bin/llvm-config; then
            sudo dpkg -i /tmp/llvm-23-debs/*.deb || sudo apt-get install -y -f --no-install-recommends
          fi
          # 运行时库路径注册（每次都要做，cache 不包含系统配置）
          echo "/usr/lib/llvm-23/lib" | sudo tee /etc/ld.so.conf.d/llvm-23.conf
          sudo ldconfig

          # 2) nightly + rust-src + android target（缓存命中时跳过）
          if ! rustup toolchain list | grep -q '^nightly-'; then
            rustup toolchain install nightly --profile minimal --component rust-src
          fi
          # aya-build 的子 cargo 用 nightly 编 bpfel-unknown-none，但也需要 android target
          if ! rustup target list --toolchain nightly | grep -q '^aarch64-linux-android (installed)'; then
            rustup target add aarch64-linux-android --toolchain nightly
          fi

          # 3) bpf-linker（编译最耗时，缓存命中时跳过；锁版本保证与缓存一致）
          if ! test -x ~/.cargo/bin/bpf-linker; then
            # bpf-linker 的 build.rs 认 LLVM_PREFIX（定位 LLVM lib 目录并输出 link-search），
            # llvm-sys（LLVM-23，bpf-linker 以 no-llvm-linking 使用）认 LLVM_SYS_231_PREFIX
            LLVM_PREFIX=/usr/lib/llvm-23 LLVM_SYS_231_PREFIX=/usr/lib/llvm-23 \
              cargo +nightly install bpf-linker --version 0.11.1
          fi
          bpf-linker --version

      - name: Build rustfrida
        run: cargo +nightly build -p rust_frida --release --locked --features watch-so --target aarch64-linux-android

      # rfclient 是跑在主机上的 TCP 控制客户端，不是 Android 二进制。仓库的
      # .cargo/config.toml 把默认 target 钉成了 aarch64-linux-android，所以这里
      # 必须显式指定宿主三元组，否则会被编成 arm64 而无法在主机执行。
      # 4) rsfrida-gadget：内嵌 agent 的独立 Gadget，供 rfclient -U -f 使用。
      #    之前不在 CI 覆盖范围内，改动物理编译错误只能在手动交叉编译时才发现。
      - name: Build rsfrida-gadget
        run: cargo build -p rsfrida-gadget --release --locked --target aarch64-linux-android

      - name: Build rfclient (host client)
        run: |
          set -euxo pipefail
          rustup target add x86_64-unknown-linux-gnu
          cargo build -p rfclient --release --locked --target x86_64-unknown-linux-gnu

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          OUT=target/aarch64-linux-android/release
          HOST_OUT=target/x86_64-unknown-linux-gnu/release
          mkdir -p dist
          cp "${OUT}/rustfrida" dist/
          cp "${OUT}/libagent.so" dist/
          cp "${OUT}/librsfrida_gadget.so" dist/librsfrida-gadget.so
          # 内嵌的 zymbiote payload 也一并产出：便于把 CI 构建结果回写到仓库
          cp zymbiote/build/zymbiote.elf dist/
          cp "${HOST_OUT}/rfclient" dist/
          file dist/* || true
          ls -l dist
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustfrida-aarch64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # rfclient 拆分出 rfclient-core 后，CLI 只是 core 的一个消费者。
  # 这一步的价值取决于「行为零变化」，而这句话必须由机器检查，不能靠人工断言。
  # 本 job 用 rfclient/tests/mock-server.py 当假设备端，把协议里 CLI 用到的
  # 四条路径跑一遍：bootstrap 多行响应、v2 tagged 应答路由、legacy(v1) 帧、
  # stale（无主 reqid）丢弃。纯 std、不需要 NDK/子模块，约 1 分钟。
  rfclient-regression:
    name: rfclient (protocol regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: host-linux

      - name: Build rfclient (Linux host)
        run: cargo build -p rfclient --release --locked --target x86_64-unknown-linux-gnu

      - name: Protocol regression against mock server
        run: |
          set -euo pipefail
          CLI=target/x86_64-unknown-linux-gnu/release/rfclient
          MOCK=rfclient/tests/mock-server.py
          fail=0

          # 起 mock，等端口就绪，跑一段 CLI，断言输出包含预期片段。
          # 参数: <端口> <模式> <子命令> <每行用;分隔的stdin> <断言1> [断言2] ...
          # 两点约定，都是为了这个脚本本身好维护：
          #   * 子命令必须显式给：不给子命令时 CLI 走 gadget/交互分支，
          #     而不是 list 的 send_query 多行查询路径；
          #   * 断言只用不含制表符的子串，避免在 YAML 里写转义。
          check() {
            local port="$1" mode="$2" subcmd="$3" input="$4"; shift 4
            # -u 关掉缓冲：否则就绪探测可能读到空日志，表现为「连接被拒」而非真实原因。
            python3 -u "$MOCK" "$port" "$mode" > "/tmp/mock-$port.log" 2>&1 &
            local mock_pid=$!
            local ready=0
            for _ in $(seq 1 100); do
              if grep -q listening "/tmp/mock-$port.log" 2>/dev/null; then ready=1; break; fi
              sleep 0.1
            done
            if [ "$ready" != 1 ]; then
              echo "  FAIL [$mode] mock 未能监听 $port，其日志："
              cat "/tmp/mock-$port.log" | sed "s/^/      | /"
              kill "$mock_pid" 2>/dev/null || true
              fail=1
              return
            fi
            local out
            local IFS=";"
            # shellcheck disable=SC2086
            out="$( { for l in $input; do printf %s "$l"; echo; done; } | "$CLI" -H "127.0.0.1:$port" --token=secret $subcmd 2>&1 || true )"
            kill "$mock_pid" 2>/dev/null || true
            for expect in "$@"; do
              if printf %s "$out" | grep -qF -- "$expect"; then
                echo "  ok   [$mode] $expect"
              else
                echo "  FAIL [$mode] 未找到: $expect"
                printf %s "$out" | sed "s/^/      | /"
                fail=1
              fi
            done
          }

          # 1) list：bootstrap 多行响应 + 表格内容（send_query 路径）
          check 18801 list list "" "STATUS" "com.example" "active"
          # 2) v2：HELLO 定案 + tagged 应答按 reqid 回位
          check 18802 session "" "jseval 1+1;exit" "已连接（协议 v2" "=> echo:jseval" "协议 v2：reqid 匹配"
          # 3) legacy：OK 行不带 proto，靠 HELLO proto=1 退回 v1
          check 18803 legacy "" "jseval 1;exit" "已连接（协议 v1）" "=> legacy-echo:jseval" "协议 v1：对端未宣告 v2"
          # 4) stale：无主 reqid 必须丢弃，不得误配给下一条命令
          check 18804 stale "" "jseval 42;exit" "[stale] 丢弃迟到的 eval 响应 (reqid=9999)" "=> echo:jseval"
          # 5) ps：走 query::list_processes 新路径；mock 把收到的整行回显成进程名，
          #    所以断言 token=secret 就等于验证了「令牌确实注入到了引导行」。
          check 18806 ps ps "" "4242" "token=secret" "PID"
          # 6) forward 命令完全在本地处理，不进 agent 命令面
          check 18805 session "" "forwards;exit" "没有正在进行的端口转发"
          exit "$fail"

      - name: Unit tests (rfclient-core)
        # 协议文本格式的解析放在 core（CLI 与 GUI 共用），它是纯函数，
        # 正好用单元测试钉住行为：多一个字段、缺字段、名字里带空格、
        # 制表符混进 label ⋯ 这些边界都不该让整张表打不开。
        run: cargo test -p rfclient-core --locked --target x86_64-unknown-linux-gnu

  # rfclient 是跑在主机上的控制客户端，Windows 使用者需要一个原生 .exe。
  # 单独开 job 而不是在 Linux 里交叉编译：msvc 目标必须用 MSVC 工具链，
  # Linux 上做不到；windows-latest 的 standard runner 对公共仓库免费。
  #
  # 这里不需要初始化子模块（只有 quickjs-hook 用得上），也不需要 NDK：
  # rfclient / rfclient-gui 全程无 bindgen / cc，仓库 .cargo/config.toml
  # 里那堆 Android 交叉工具对它不生效（显式 --target 会覆盖 [build].target）。
  #
  # 两个产物同出一个 job：共用同一份 cargo 缓存与工具链，且它们的依赖树
  # 高度重叠（都依赖 rfclient-core），分开跑只是让缓存互相冷启动。
  rfclient-windows:
    name: rfclient (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build rfclient + rfclient-gui (Windows x86_64)
        # +crt-static：把 MSVC 运行库静态链进 exe，产物不依赖「VC++ 可再发行
        # 组件包」，拷到任意 Windows x64 上可直接运行。
        #
        # eframe 用 glow（OpenGL）后端而不是默认的 wgpu：不要求 DX12/Vulkan，
        # 虚拟机、远程桌面、老显卡上都能起来 —— 调试工具经常就在那些环境里跑。
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build -p rfclient --release --locked --target x86_64-pc-windows-msvc
          cargo build -p rfclient-gui --release --locked --target x86_64-pc-windows-msvc

      - name: Unit tests (rfclient-gui)
        # 字体测试是这里最值钱的一条：它把字体真的装进 egui 并检查汉字覆盖，
        # 直接对应「界面中文是否显示为方块」。runner 上没装中文字体时该用例
        # 自动跳过（不算失败），有装就是一次真实的端到端验证。
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        # --nocapture：让字体测试把「用了哪个字体」或「因环境跳过」打出来。
        # 否则跳过与通过在日志里长得一样，等于不知道 CI 到底验没验。
        run: cargo test -p rfclient-gui --locked --target x86_64-pc-windows-msvc -- --nocapture

      - name: Verify and collect
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/rfclient.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }

          # 冒烟测试：架构不对或运行库缺失时这里会失败，
          # 避免只凭「文件存在」就判定成功。
          # 必须先让进程跑完再取退出码：`| Select-Object -First N` 会提前打断管道
          # （PowerShell 取消上游命令），$LASTEXITCODE 会取不到值。
          $help = & $exe --help
          $code = $LASTEXITCODE
          $help | Select-Object -First 3
          if ($code -ne 0) { throw "rfclient.exe --help 失败，退出码 $code" }

          # GUI 只做「文件存在 + 能加载」级别的检查：它需要窗口系统与 OpenGL，
          # 在无头 runner 上启动必然失败，那属于环境而不是代码问题。
          $gui = "target/x86_64-pc-windows-msvc/release/rfclient-gui.exe"
          if (-not (Test-Path $gui)) { throw "构建产物不存在: $gui" }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/rfclient.exe
          Copy-Item $gui dist/rfclient-gui.exe
          Get-ChildItem dist/*.exe | Format-Table Name, Length
          $lines = Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content -Encoding ascii dist/SHA256SUMS.txt -Value $lines
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rfclient-windows-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30