name: Build (Android aarch64)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: r29
  NDK_DIR: /opt/android-ndk-r29
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: agent + rustfrida
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # NDK r29 安装到 /opt/android-ndk-r29，与仓库内 .cargo/config.toml
      # 里写死的 linker / sysroot / BINDGEN_EXTRA_CLANG_ARGS 路径保持一致。
      - name: Restore Android NDK ${{ env.NDK_VERSION }}
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_VERSION }}-linux-x86_64

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            -o /tmp/android-ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          sudo mkdir -p "${NDK_DIR}"
          sudo unzip -q /tmp/android-ndk.zip -d /opt
          rm -f /tmp/android-ndk.zip

      # NDK r29 只提供 llvm-* 工具，没有 aarch64-linux-android-ar 这类
      # 目标三元组前缀的包装脚本；cc-rs 不会自动回退到 llvm-ar，所以必须
      # 显式导出 AR_<triple>（两种写法 cc-rs 都查）。
      # LIBCLANG_PATH 指向 NDK 自带的 libclang.so，让 bindgen 与工具链/ sysroot
      # 保持同一个 clang 版本，避免宿主 libclang 与 NDK 头文件不匹配。
      - name: Configure Android NDK env
        run: |
          set -euxo pipefail
          TC="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBCLANG="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/lib"

          CC="${TC}/aarch64-linux-android33-clang"
          CXX="${TC}/aarch64-linux-android33-clang++"
          test -x "${CC}"
          test -x "${CXX}"
          test -x "${TC}/llvm-ar"
          test -x "${TC}/llvm-objcopy"
          test -d "${SYSROOT}"
          test -f "${LIBCLANG}/libclang.so"

          {
            echo "ANDROID_NDK_HOME=${NDK_DIR}"
            echo "ANDROID_NDK_ROOT=${NDK_DIR}"
            echo "CC_aarch64-linux-android=${CC}"
            echo "CC_aarch64_linux_android=${CC}"
            echo "CXX_aarch64-linux-android=${CXX}"
            echo "CXX_aarch64_linux_android=${CXX}"
            echo "AR_aarch64-linux-android=${TC}/llvm-ar"
            echo "AR_aarch64_linux_android=${TC}/llvm-ar"
            echo "RANLIB_aarch64-linux-android=${TC}/llvm-ranlib"
            echo "RANLIB_aarch64_linux_android=${TC}/llvm-ranlib"
            echo "LIBCLANG_PATH=${LIBCLANG}"
          } >> "${GITHUB_ENV}"
          echo "${TC}" >> "${GITHUB_PATH}"

          "${CC}" --version | head -1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Show toolchain
        run: |
          rustc -Vv
          cargo -V
          python3 --version

      # 1) loader shellcode：rustfrida 通过 include_bytes! 内嵌，必须先构建。
      #    （rust_frida/build.rs 也会兜底重跑，这里显式跑一次便于早期报错）
      - name: Build loader shellcode
        run: python3 loader/build_helpers.py

      # 2) agent：rustfrida 通过 include_bytes! 内嵌 libagent.so，必须先于主程序。
      - name: Build agent (libagent.so)
        run: cargo build -p agent --release --locked --target aarch64-linux-android

      # 3) 主程序：内嵌 bootstrapper.bin + rustfrida-loader.bin + libagent.so
      - name: Build rustfrida
        run: cargo build -p rust_frida --release --locked --target aarch64-linux-android

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          OUT=target/aarch64-linux-android/release
          mkdir -p dist
          cp "${OUT}/rustfrida" dist/
          cp "${OUT}/libagent.so" dist/
          file dist/* || true
          ls -l dist
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustfrida-aarch64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30